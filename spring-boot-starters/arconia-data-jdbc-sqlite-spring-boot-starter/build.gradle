plugins {
    id "java-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

dependencies {
    api project(":arconia-core:arconia-core-bootstrap")
    api project(":arconia-data:arconia-data-jdbc-sqlite")
    api "org.springframework.boot:spring-boot-starter-data-jdbc"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia Data JDBC SQLite Spring Boot Starter"
                description = "Arconia Data JDBC SQLite Spring Boot Starter."
            }
        }
    }
}
