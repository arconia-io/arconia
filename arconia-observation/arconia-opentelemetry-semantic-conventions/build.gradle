plugins {
    id "code-quality-conventions"
    id "java-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    api project(":arconia-spring-boot")
    api project(":arconia-observation:arconia-observation")
    api "io.opentelemetry:opentelemetry-api"
    api "io.opentelemetry.semconv:opentelemetry-semconv:${openTelemetrySemanticConventionsVersion}"
    api "io.micrometer:micrometer-core"

    optional "org.springframework.boot:spring-boot-autoconfigure"
    optional "org.springframework:spring-web"
    optional "jakarta.servlet:jakarta.servlet-api"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "tools.jackson.core:jackson-databind"
    testImplementation "org.springframework:spring-web"
    testImplementation "org.springframework.boot:spring-boot-restclient"
    testImplementation "jakarta.servlet:jakarta.servlet-api"
    testRuntimeOnly "io.micrometer:micrometer-tracing-bridge-otel"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.springframework:spring-webmvc"
}

dependencyManagement {
    imports {
        mavenBom "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${openTelemetryInstrumentationVersion}"
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia OpenTelemetry Semantic Conventions"
                description = "Arconia OpenTelemetry Semantic Conventions."
            }
        }
    }
}
