plugins {
    id "java-conventions"
    id "nullability-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    api project(":arconia-observation:arconia-observation")
    api "com.arize:openinference-semantic-conventions:${openInferenceVersion}"
    api "org.springframework.ai:spring-ai-model"



    optional project(":arconia-opentelemetry:arconia-opentelemetry")
    optional "org.springframework.boot:spring-boot-autoconfigure"
    optional "org.springframework.ai:spring-ai-client-chat"
    optional "io.micrometer:micrometer-tracing-bridge-otel"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "io.micrometer:micrometer-tracing-bridge-otel"
    testImplementation "io.opentelemetry:opentelemetry-sdk-testing"
    testRuntimeOnly project(":arconia-opentelemetry:arconia-opentelemetry")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

dependencyManagement {
    imports {
        mavenBom "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${openTelemetryInstrumentationVersion}"
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia OpenInference AI Semantic Conventions"
                description = "Arconia OpenInference AI Semantic Conventions."
            }
        }
    }
}
