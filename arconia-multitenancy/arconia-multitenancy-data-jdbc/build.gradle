plugins {
    id "java-conventions"
    id "nullability-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

dependencies {
    api project(":arconia-core")
    api project(":arconia-multitenancy:arconia-multitenancy-core")
    api "org.springframework.boot:spring-boot-jdbc"

    implementation "org.slf4j:slf4j-api"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly "com.h2database:h2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia Multitenancy Data JDBC"
                description = "Arconia Multitenancy Data JDBC."
            }
        }
    }
}
