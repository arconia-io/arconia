plugins {
    id "java-conventions"
    id "nullability-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

dependencies {
    implementation "org.springframework:spring-context"
    implementation "org.springframework:spring-test"

    testImplementation project(":arconia-opentelemetry:arconia-opentelemetry")
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "io.opentelemetry:opentelemetry-exporter-logging"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// The module has no public types, and the Javadoc tool fails when it finds nothing to document.
javadoc {
    options.memberLevel = JavadocMemberLevel.PACKAGE
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia OpenTelemetry Test"
                description = "Arconia OpenTelemetry Test."
            }
        }
    }
}
