plugins {
    id "java-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

dependencies {
    api project(":arconia-integrations:arconia-docling")
    api "org.springframework.ai:spring-ai-commons"

    testImplementation "ai.docling:docling-testcontainers"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

dependencyManagement {
    imports {
        mavenBom "ai.docling:docling-bom:${doclingVersion}"
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia AI Docling Document Reader"
                description = "Arconia AI Docling Document Reader."
            }
        }
    }
}
