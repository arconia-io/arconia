plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
    id 'io.arconia.optional-dependencies'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
}

// Every module declares its packages @NullMarked, so JSpecify is part of its API.
// Modules without code, like the starters, don't need it.
if (file("src/main/java").exists()) {
    dependencies {
        api "org.jspecify:jspecify"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs.add("-parameters")
}

tasks.named('compileJava') {
    inputs.files(tasks.named('processResources'))
}

tasks.named('jar') {
    def title = project.name
    def version = project.version.toString()
    manifest {
        attributes(
            'Implementation-Title': title,
            'Implementation-Version': version
        )
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
    }
}
