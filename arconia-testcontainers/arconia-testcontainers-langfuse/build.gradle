plugins {
    id "code-quality-conventions"
    id "java-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

dependencies {
    api project(":arconia-testcontainers:arconia-testcontainers-redis")
    api "io.floci:testcontainers-floci-aws:${flociVersion}"
    api "org.jspecify:jspecify"
    api "org.testcontainers:testcontainers-clickhouse"
    api "org.testcontainers:testcontainers-junit-jupiter"
    api "org.testcontainers:testcontainers-postgresql"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Testcontainers Langfuse"
                description = "Testcontainers Langfuse."
            }
        }
    }
}
