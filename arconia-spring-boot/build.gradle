plugins {
    id "java-conventions"
    id "nullability-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

// The configuration metadata (META-INF/spring-configuration-metadata.json) is hand-maintained
// because the bootstrap properties are resolved before the application configuration is loaded
// and are not bound to @ConfigurationProperties classes. The spring-boot-configuration-processor
// wouldn't help: it only runs when a class carries one of the annotations it processes (such as
// @ConfigurationProperties or @Configuration), and none in this module does.
// BootstrapConfigurationMetadataTests keeps the metadata in sync with the code.
dependencies {
    api project(":arconia-core")
    api "org.springframework.boot:spring-boot"

    optional "org.springframework.boot:spring-boot-autoconfigure"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-devtools"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia Spring Boot"
                description = "Arconia Spring Boot."
            }
        }
    }
}
