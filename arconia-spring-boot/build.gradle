plugins {
    id "code-quality-conventions"
    id "java-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

// The configuration metadata (META-INF/spring-configuration-metadata.json) is hand-maintained
// because the bootstrap properties are resolved before the application configuration is loaded
// and are not bound to @ConfigurationProperties classes. If the spring-boot-configuration-processor
// is ever added back, move that content to META-INF/additional-spring-configuration-metadata.json
// to avoid clashing with the generated file.
dependencies {
    api project(":arconia-core")
    api "org.springframework.boot:spring-boot"

    optional "org.springframework.boot:spring-boot-autoconfigure"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-devtools"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia Spring Boot"
                description = "Arconia Spring Boot."
            }
        }
    }
}
