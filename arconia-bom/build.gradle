plugins {
    id "java-platform"
    id "release-conventions"
}

javaPlatform {
    allowDependencies()
}

repositories {
    mavenCentral()
}

dependencies {
    constraints {
        api project(":arconia-ai-docling-document-reader")

        api project(":arconia-core-annotations")
        api project(":arconia-core-bootstrap")
        api project(":arconia-core-bootstrap-profiles")

        api project(":arconia-data-jdbc-sqlite")

        api project(":arconia-dev-services-api")
        api project(":arconia-dev-services-core")

        api project(":arconia-dev-services-artemis")
        api project(":arconia-dev-services-docling")
        api project(":arconia-dev-services-elasticsearch")
        api project(":arconia-dev-services-floci")
        api project(":arconia-dev-services-kafka")
        api project(":arconia-dev-services-keycloak")
        api project(":arconia-dev-services-langfuse")
        api project(":arconia-dev-services-lgtm")
        api project(":arconia-dev-services-lldap")
        api project(":arconia-dev-services-mariadb")
        api project(":arconia-dev-services-mongodb")
        api project(":arconia-dev-services-mongodb-atlas")
        api project(":arconia-dev-services-mysql")
        api project(":arconia-dev-services-oidc")
        api project(":arconia-dev-services-ollama")
        api project(":arconia-dev-services-openlit")
        api project(":arconia-dev-services-oracle")
        api project(":arconia-dev-services-oracle-xe")
        api project(":arconia-dev-services-otel-collector")
        api project(":arconia-dev-services-phoenix")
        api project(":arconia-dev-services-postgresql")
        api project(":arconia-dev-services-pulsar")
        api project(":arconia-dev-services-rabbitmq")
        api project(":arconia-dev-services-redis")

        api project(":arconia-dev")

        api project(":arconia-dev-ui-api")
        api project(":arconia-dev-ui-server")

        api project(":arconia-docling")

        api project(":arconia-multitenancy-core")
        api project(":arconia-multitenancy-data-jdbc")
        api project(":arconia-multitenancy-details-jdbc")
        api project(":arconia-multitenancy-web")

        api project(":arconia-observation")
        api project(":arconia-openinference-ai-semantic-conventions")
        api project(":arconia-opentelemetry-ai-semantic-conventions")
        api project(":arconia-opentelemetry-semantic-conventions")

        api project(":arconia-opentelemetry")
        api project(":arconia-opentelemetry-exporter-sender-http")
        api project(":arconia-opentelemetry-logback-bridge")
        api project(":arconia-opentelemetry-micrometer-metrics-bridge")
        api project(":arconia-opentelemetry-micrometer-registry-otlp")
        api project(":arconia-opentelemetry-test")

        api project(":arconia-data-jdbc-sqlite-spring-boot-starter")
        api project(":arconia-docling-spring-boot-starter")
        api project(":arconia-multitenancy-core-spring-boot-starter")
        api project(":arconia-multitenancy-details-jdbc-spring-boot-starter")
        api project(":arconia-multitenancy-web-spring-boot-starter")
        api project(":arconia-opentelemetry-spring-boot-starter")
        api project(":arconia-opentelemetry-spring-boot-starter-test")
        api project(":arconia-spring-boot-starter")

        api project(":arconia-testcontainers-langfuse")
        api project(":arconia-testcontainers-openlit")
        api project(":arconia-testcontainers-phoenix")
        api project(":arconia-testcontainers-redis")

        api "io.opentelemetry.semconv:opentelemetry-semconv:${openTelemetrySemanticConventionsVersion}"
        api "io.opentelemetry.semconv:opentelemetry-semconv-incubating:${openTelemetrySemanticConventionsVersion}-alpha"
    }

    api platform("ai.docling:docling-bom:${doclingVersion}")
    api platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:${openTelemetryInstrumentationVersion}-alpha")
    api platform("net.ttddyy.observation:datasource-micrometer-bom:${datasourceMicrometerSpringBootVersion}")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia BOM"
                description = "Arconia Bill of Materials."
                packaging = "pom"
            } 
        }
    }
}
