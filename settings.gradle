plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version '1.0.0'
}

rootProject.name = 'arconia'

// Each module is included by its name, with its folder set explicitly, so that the folders that
// group modules don't become projects of their own. As projects, they would take the group of
// the modules, and a folder named like one of its modules, such as arconia-dev, would claim the
// coordinates of that module in a composite build.
// https://docs.gradle.org/current/userguide/best_practices_structuring_builds.html#avoid_empty_projects
def module(String path) {
    def name = path.substring(path.lastIndexOf('/') + 1)
    include name
    project(":${name}").projectDir = file(path)
}

// BOM
module 'arconia-bom'

// AI
module 'arconia-ai/arconia-ai-docling-document-reader'

// Core
module 'arconia-core/arconia-core-annotations'
