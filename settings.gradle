plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version '1.0.0'
}

rootProject.name = 'arconia'

// The folders that group modules are projects too, and they would take the group of the
// modules. A folder named like one of its modules, such as arconia-dev, would then claim the
// coordinates of that module, which a composite build cannot tell apart. The folders publish
// nothing, so they get a group of their own.
gradle.lifecycle.beforeProject { project ->
    if (project != project.rootProject && !project.buildFile.exists()) {
        project.group = 'io.arconia.folders'
    }
}

// BOM
include 'arconia-bom'

// AI
include 'arconia-ai:arconia-ai-docling-document-reader'

// Core
include 'arconia-core:arconia-core-annotations'
include 'arconia-core:arconia-core-bootstrap'
include 'arconia-core:arconia-core-bootstrap-profiles'

// Data
include 'arconia-data:arconia-data-jdbc-sqlite'

// Dev
include 'arconia-dev:arconia-dev'

// Dev Services
