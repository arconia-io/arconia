plugins {
    id "java-conventions"
    id "nullability-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor"

    api project(":arconia-core-annotations")
    api "org.springframework.boot:spring-boot-data-jdbc"
    api "org.xerial:sqlite-jdbc"

    optional "org.springframework.boot:spring-boot-autoconfigure"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-starter-data-jdbc-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test') {
    // The SQLite JDBC driver loads a native library.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia Data JDBC SQLite"
                description = "Arconia Data JDBC SQLite."
            }
        }
    }
}
