plugins {
    id "java-conventions"
    id "nullability-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    api project(":arconia-dev:arconia-dev-services:arconia-dev-services-core")
    api "org.springframework.boot:spring-boot-pulsar"
    api "org.springframework.boot:spring-boot-autoconfigure"
    api "org.testcontainers:testcontainers-pulsar"

    testImplementation testFixtures(project(":arconia-dev:arconia-dev-services:arconia-dev-services-core"))
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    constraints {
        // TEMPORARY: CVE fix in guava, which pulsar-client pins to a vulnerable version and Spring Boot does not manage.
        api("com.google.guava:guava:33.7.2-jre") {
            because "GHSA-xxph-c9ww-hj94 (fixed in 33.7.2)"
        }
    }
}

dependencyManagement {
    imports {
        mavenBom "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${openTelemetryInstrumentationVersion}"
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia Dev Services Pulsar"
                description = "Arconia Dev Services Pulsar."
            }
        }
    }
}
