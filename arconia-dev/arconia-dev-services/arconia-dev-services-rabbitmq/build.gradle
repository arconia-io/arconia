plugins {
    id "java-conventions"
    id "nullability-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

// TEMPORARY: CVE fixes in amqp-client. Remove once Spring Boot 4.1.x upgrades (spring-projects/spring-boot#52296)
ext['rabbit-amqp-client.version'] = '5.37.0'

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    api project(":arconia-dev:arconia-dev-services:arconia-dev-services-core")
    api "org.springframework.boot:spring-boot-amqp"
    api "org.springframework.boot:spring-boot-autoconfigure"
    api "org.testcontainers:testcontainers-rabbitmq"

    testImplementation testFixtures(project(":arconia-dev:arconia-dev-services:arconia-dev-services-core"))
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-starter-amqp"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia Dev Services RabbitMQ"
                description = "Arconia Dev Services RabbitMQ."
            }
        }
    }
}
