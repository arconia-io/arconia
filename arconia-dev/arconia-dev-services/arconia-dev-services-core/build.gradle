plugins {
    id "code-quality-conventions"
    id "java-conventions"
    id "java-test-fixtures"
    id "sbom-conventions"
    id "release-conventions"
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    api project(":arconia-dev:arconia-dev-services:arconia-dev-services-api")
    api project(":arconia-spring-boot")
    api "org.springframework.boot:spring-boot-testcontainers"

    optional "org.springframework.boot:spring-boot-actuator"
    optional "org.springframework.boot:spring-boot-actuator-autoconfigure"
    optional "org.springframework.boot:spring-boot-jdbc"
    optional "org.testcontainers:testcontainers-jdbc"

    testFixturesApi "org.springframework.boot:spring-boot-starter-test"
    testFixturesImplementation "org.springframework.boot:spring-boot-jdbc"
    testFixturesImplementation "org.testcontainers:testcontainers-jdbc"

    testImplementation "org.springframework:spring-core-test"
    testImplementation "org.springframework.boot:spring-boot-jackson"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testImplementation "org.testcontainers:testcontainers-postgresql"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// The test fixtures are for the dev service modules of this build only.
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia Dev Services Core"
                description = "Arconia Dev Services Core."
            }
        }
    }
}
