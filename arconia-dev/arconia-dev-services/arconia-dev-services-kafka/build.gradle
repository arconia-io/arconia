plugins {
    id "java-conventions"
    id "nullability-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    api project(":arconia-dev:arconia-dev-services:arconia-dev-services-core")
    api "org.springframework.boot:spring-boot-kafka"
    api "org.springframework.boot:spring-boot-autoconfigure"
    api "org.testcontainers:testcontainers-kafka"

    testImplementation testFixtures(project(":arconia-dev:arconia-dev-services:arconia-dev-services-core"))
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-starter-kafka"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    constraints {
        // TEMPORARY: CVE fixes in compression libraries that kafka-clients pins to vulnerable versions and Spring Boot does not manage.
        api("org.xerial.snappy:snappy-java:1.1.10.12") {
            because "GHSA-q233-g92q-qxp6, GHSA-gwq9-9ffj-mvrv, GHSA-xqrx-qh46-34m7 (fixed in 1.1.10.9)"
        }
        api("at.yawk.lz4:lz4-java:1.12.1") {
            because "GHSA-mcr4-qmvw-px4g, GHSA-343h-94h5-c4wr, GHSA-gm45-99xc-r7wv (fixed in 1.11.4), GHSA-48mj-8f7c-7qfm (fixed in 1.12.1)"
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia Dev Services Kafka"
                description = "Arconia Dev Services Kafka."
            }
        }
    }
}
