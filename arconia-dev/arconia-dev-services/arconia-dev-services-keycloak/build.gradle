plugins {
    id "code-quality-conventions"
    id "java-conventions"
    id "sbom-conventions"
    id "release-conventions"
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    api project(":arconia-dev:arconia-dev-services:arconia-dev-services-core")
    api "org.springframework.boot:spring-boot-starter"
    api "org.springframework.boot:spring-boot-testcontainers"

    api("com.github.dasniko:testcontainers-keycloak:${testcontainersKeycloakVersion}") {
        exclude group: "org.jboss.shrinkwrap"
    }

    optional "org.springframework.boot:spring-boot-devtools"
    optional "org.springframework.boot:spring-boot-security-oauth2-client"
    optional "org.springframework.boot:spring-boot-security-oauth2-resource-server"

    testImplementation project(":arconia-dev:arconia-dev-services:arconia-dev-services-tests")
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = "Arconia Dev Services Keycloak"
                description = "Arconia Dev Services Keycloak."
            }
        }
    }
}
